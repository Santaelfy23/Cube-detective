<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Detective</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Lexend:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
/* Layout: a detective's desk. Case-file folders on the home screen; each case is one focused working sheet. */
:root{
  --bg:#D9DDE5; --surface:#ECEEF2; --ink:#1B2333; --muted:#545F72; --line:#C4CBD7;
  --folder:#E3C07E; --folder-ink:#4A3510; --accent:#2B57D0; --accent-soft:#D8E0F3;
  --good:#17804A; --good-soft:#DDF2E6; --bad:#C33227; --bad-soft:#FBE3E0;
  --cube-top:#F1F3F7; --cube-l:#C3CBDA; --cube-r:#A1ADC3; --cube-line:#1B2333;
  --hl-top:#BFD0FA; --hl-l:#8EA9EF; --hl-r:#6E8EE3;
  --hid-top:#FFD970; --hid-l:#EDB93F; --hid-r:#CC9524;
  --p1:#F5C542; --p2:#6CC4A1; --p3:#F08A7E;
  --font-display:"Special Elite","Courier New",monospace;
  --font-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2C3445;
  --folder:#B38E4B; --folder-ink:#1E1607; --accent:#86A6FF; --accent-soft:#222E4D;
  --good:#4CC985; --good-soft:#163526; --bad:#FF7468; --bad-soft:#3C1D1B;
  --cube-top:#7383A8; --cube-l:#48546F; --cube-r:#2C3447; --cube-line:#C7D0E2;
  --hl-top:#4E6AB8; --hl-l:#3A549A; --hl-r:#2E4580;
  --hid-top:#C49A2E; --hid-l:#9C7820; --hid-r:#7A5D17;
  --p1:#C99C24; --p2:#3E9C78; --p3:#C8645A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2C3445;
  --folder:#B38E4B; --folder-ink:#1E1607; --accent:#86A6FF; --accent-soft:#222E4D;
  --good:#4CC985; --good-soft:#163526; --bad:#FF7468; --bad-soft:#3C1D1B;
  --cube-top:#7383A8; --cube-l:#48546F; --cube-r:#2C3447; --cube-line:#C7D0E2;
  --hl-top:#4E6AB8; --hl-l:#3A549A; --hl-r:#2E4580;
  --hid-top:#C49A2E; --hid-l:#9C7820; --hid-r:#7A5D17;
  --p1:#C99C24; --p2:#3E9C78; --p3:#C8645A;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,5vw,2.3rem);margin:0;letter-spacing:.02em;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.92rem}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn-ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
/* home */
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;margin-top:8px}
.folder{position:relative;text-align:left;background:var(--folder);color:var(--folder-ink);border:none;border-radius:4px 12px 12px 12px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:8px;min-height:170px}
.folder::before{content:attr(data-tab);position:absolute;top:-20px;left:0;background:var(--folder);border-radius:8px 8px 0 0;padding:2px 14px;font-family:var(--font-display);font-size:.85rem;letter-spacing:.06em}
.folder:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.folder h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.45rem}
.folder p{margin:0;font-size:.93rem}
.folder .meta{margin-top:auto;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.motto{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px;font-size:.95rem}
.motto b{font-family:var(--font-display);font-weight:400;font-size:1.05rem}
/* case sheet */
.sheet{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.6rem;line-height:1.15}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rule{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.rule ol,.rule ul{margin:6px 0 0;padding-left:20px}
.rule strong{color:var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 14px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:680px){.stage{grid-template-columns:minmax(0,1fr)}}
canvas.stack{width:100%;display:block;background:var(--bg);border-radius:10px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:1rem}
svg{display:block;max-width:100%}
.plan .cellp{cursor:pointer}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keypad button{padding:10px 0;font-weight:600;font-variant-numeric:tabular-nums}
input.num{font-family:inherit;font-size:1.3rem;width:110px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.feedback{border-radius:10px;padding:12px 14px;font-size:.95rem}
.feedback.ok{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.options button{font-size:1.25rem;font-weight:600;padding:14px 0;font-variant-numeric:tabular-nums}
.options button.right{background:var(--good-soft);border-color:var(--good)}
.options button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stamp{font-family:var(--font-display);font-size:1.6rem;padding:16px 0;border-width:3px;letter-spacing:.12em}
.stamp.real{color:var(--good);border-color:var(--good)}
.stamp.fake{color:var(--bad);border-color:var(--bad)}
.netbox{display:flex;justify-content:center;padding:16px;background:var(--bg);border-radius:10px;min-height:220px;align-items:center;position:relative}
.verdict{position:absolute;top:12px;right:12px;font-family:var(--font-display);font-size:1.5rem;padding:4px 12px;border:3px solid currentColor;border-radius:6px;transform:rotate(-8deg);background:var(--surface)}
.verdict.real{color:var(--good)}.verdict.fake{color:var(--bad)}
.hunt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:min(100%,300px);aspect-ratio:1;max-width:100%}
.cell{border:1.5px dashed var(--line);background:var(--bg);border-radius:4px;padding:0}
.cell[aria-pressed="true"]{background:var(--accent);border:1.5px solid var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center;background:var(--bg)}
.slot.found{background:var(--surface);border-color:var(--good)}
.slot small{font-size:.72rem;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.slot .q{font-family:var(--font-display);font-size:1.8rem;color:var(--muted)}
.slot.flash{animation:flash 1s ease}
@keyframes flash{0%{transform:scale(1.12);box-shadow:0 0 0 4px var(--good)}100%{transform:none}}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:18px 0}
.done .big{font-family:var(--font-display);font-size:2.4rem}
.notes{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.notes>h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.nb{display:flex;flex-direction:column;gap:6px}
.nb h4{margin:0;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nb p{margin:0}
.nb.trick{border-left:4px solid var(--accent);padding-left:12px}
.nb.trap{border-left:4px solid var(--bad);padding-left:12px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.fig{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.fig canvas{width:100%;display:block}
.fig figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:baseline}
ol.steps{margin:8px 0 8px 20px;padding:0}ol.steps li{margin:6px 0}
.checks .y{color:var(--good);font-weight:700}.checks .n{color:var(--bad);font-weight:700}.checks .s{color:var(--muted);font-weight:700}
.key{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;background:var(--hid-top);border:1px solid var(--cube-line)}
.qtext{margin:0;font-weight:600}
.copts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.copts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.copts,.copts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.copt{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.copt .pick{width:100%;padding:24px 6px 8px;position:relative;min-height:110px;display:flex;align-items:center;justify-content:center}
.copt .lbl{position:absolute;top:5px;left:8px;font-weight:700;font-size:.85rem;color:var(--muted)}
.copt .xo{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:.8rem;border-radius:8px}
.copt.out .pick{opacity:.35}
.copt.out .pick::after{content:"";position:absolute;inset:10% 10%;background:linear-gradient(to top right,transparent calc(50% - 2px),var(--bad) calc(50% - 2px),var(--bad) calc(50% + 2px),transparent calc(50% + 2px))}
.copt.right .pick{border-color:var(--good);background:var(--good-soft);opacity:1}
.copt.wrong .pick{border-color:var(--bad);background:var(--bad-soft)}
.why{display:flex;flex-wrap:wrap;gap:4px}
.why button{padding:6px 8px;font-size:.82rem;flex:1 1 auto}
.tagr{font-size:.78rem;font-weight:700;color:var(--bad);text-align:center;min-height:1em}
.tablewrap{overflow-x:auto}
table.res{border-collapse:collapse;width:100%;font-size:.92rem}
table.res th,table.res td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.res td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.y{color:var(--good);font-weight:700}.n{color:var(--bad);font-weight:700}.s{color:var(--muted);font-weight:700}
.week{display:flex;flex-direction:column;gap:14px}
.wk{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:10px 0 0;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.folder.sealed{background:var(--line);color:var(--muted);cursor:default}
.folder.sealed::before{background:var(--line)}
.folder.sealed:hover{transform:none;box-shadow:none}
.classified{align-self:flex-start;font-family:var(--font-display);color:var(--bad);border:2.5px solid var(--bad);padding:2px 10px;transform:rotate(-4deg);letter-spacing:.12em}
.chip{position:absolute;top:12px;right:12px;background:var(--bad);color:var(--surface);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.gate{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.gate.ready{border:2px solid var(--accent)}.gate.passed{border:1.5px solid var(--good)}
.gate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gate h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.warm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.warm h3{margin:0 0 2px;font-size:1.05rem}
.warm>div{flex:1 1 260px;min-width:0}
.parent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.parent{display:flex;flex-direction:column;gap:10px;border:2px solid var(--folder)!important}
.mine{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.mine summary{cursor:pointer;font-weight:600}
.brand h1{cursor:default;user-select:none;-webkit-user-select:none}
.mine .row,.mine .backup{margin-top:8px}
.collection{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.col-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col-head>div{flex:1 1 220px;min-width:0}
.collection h3{margin:2px 0 6px;font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.rankbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.rankbar i{display:block;height:100%;background:var(--folder)}
.stampmeter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stampmeter p{flex-basis:100%}
.st{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--line);font-size:1.1rem}
.st.on{border:2px solid var(--bad);color:var(--bad);transform:rotate(-8deg)}
.col-cards{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.owed{background:var(--folder);color:var(--folder-ink);font-weight:700;padding:4px 10px;border-radius:999px}
.collection summary{cursor:pointer;font-weight:600;font-size:.92rem}
.howto{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
input.num.small{width:70px;font-size:1rem;padding:6px 8px}
#toasts{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:20}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;max-width:min(100%,460px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s ease}
.toast span{opacity:.8}
.toast.card{background:var(--folder);color:var(--folder-ink);font-size:1.05rem}
.toast.rank{background:var(--accent);color:var(--surface)}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.backup{display:flex;flex-direction:column;gap:8px;margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:10px}
textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;word-break:break-all}
.fbpanel{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30}
.fbcard{background:var(--surface);border-radius:var(--r);padding:18px;width:min(100%,520px);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.fbcard h3{font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.fblabel{font-weight:600;font-size:.92rem;margin-bottom:4px;display:block}
.fbcard textarea{width:100%;font-family:inherit;font-size:1rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.fblist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fblist li{border-left:3px solid var(--folder);padding:2px 0 2px 10px}
.speed{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:min(100%,460px);display:flex;flex-direction:column;gap:4px}
.speed.ok{border-color:var(--good);background:var(--good-soft)}
.sp-row{display:grid;grid-template-columns:80px 60px 1fr;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.mast{background:var(--good);color:var(--surface);padding:1px 8px;border-radius:999px}
.nextup{background:var(--accent-soft);border-radius:var(--r);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.nextup>div{flex:1 1 240px;min-width:0}
.nextup h3{margin:2px 0;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.recall{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.recall summary{cursor:pointer;font-weight:600}
.recall p{margin:6px 0 0}
.rulebox{background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rulebox h4{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rulebox p{margin:0}.rb-rule{font-weight:600;font-size:1.02rem}
.revise{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.revise h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.streak{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.st-num{display:flex;flex-direction:column;align-items:center;min-width:72px}
.st-num b{font-family:var(--font-display);font-weight:400;font-size:2.4rem;line-height:1;color:var(--folder)}
.st-num span{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-main{flex:1 1 240px;min-width:0}
.st-week{display:flex;gap:6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted);flex:1;max-width:44px}
.sd i{width:100%;max-width:30px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:block}
.sd.on i{background:var(--folder);border:2px solid var(--folder)}
.sd.today span,.sd.today{font-weight:700;color:var(--ink)}
.rowsum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.pp{display:block;font-weight:700;color:var(--folder);margin-bottom:6px}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.layer{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border-radius:8px;padding:4px}
.layer canvas{width:100%;display:block}.layer span{font-size:.78rem;font-weight:700;color:var(--muted)}

<body>


<div class="app">
  <header>
    <div class="brand">
      <h1>Cube Detective</h1>
      <p>Rule options out. Then pick.</p>
    </div>
    <div class="row"><button id="themeBtn" class="btn-ghost" aria-label="Switch colours">Light mode</button><button id="fbBtn" class="btn-ghost">Feedback</button><button id="homeBtn" class="btn-ghost" hidden>← All case files</button></div>
  </header>
  <main id="view"></main>
  <div id="fbPanel" class="fbpanel" hidden role="dialog" aria-modal="true" aria-labelledby="fbTitle"><div class="fbcard">
    <div class="gate-head"><h3 id="fbTitle" style="margin:0">Tell us what you think</h3><button class="btn-ghost" id="fbClose">Close</button></div>
    <p class="muted" style="margin:0" id="fbWhere"></p>
    <div><div class="fblabel">How hard was it?</div><div class="seg" id="fbHard"><button data-v="Too easy">Too easy</button><button data-v="Just right">Just right</button><button data-v="Too hard">Too hard</button></div></div>
    <div><div class="fblabel">How fun was it?</div><div class="seg" id="fbFun"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
    <label class="fblabel" for="fbText">Anything to change, fix or add?</label>
    <textarea id="fbText" rows="4" placeholder="Something confusing, a bug, an idea for a new case file…"></textarea>
    <div class="row"><button class="btn-primary" id="fbSend">Save feedback</button><span class="muted" id="fbMsg"></span></div></div></div>
</div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const view=$('#view');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem('cd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('cd_'+k,JSON.stringify(v))}catch(e){}}};
let redraw=null, timerId=null;
const QT={t0:0,ts:[],reset(){this.ts=[];this.t0=0},start(){this.t0=Date.now()},stop(){if(this.t0){this.ts.push((Date.now()-this.t0)/1000);this.t0=0}},
  avg(){return this.ts.length?Math.round(this.ts.reduce((a,b)=>a+b,0)/this.ts.length):null}};
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>redraw&&redraw())}catch(e){}
new MutationObserver(()=>redraw&&redraw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',()=>redraw&&redraw());
$('#homeBtn').onclick=()=>home();

/* ============ 3D stack drawing ============ */
const P3=(x,y,z)=>[x-y,(x+y)/2-z];
function cubeFaces(x,y,z){return{top:[[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],l:[[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]],r:[[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]]}}
function stackCubes(H){const c=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)for(let z=0;z<H[x][y];z++)c.push([x,y,z]);
  return c.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2])}
function isoFit(cubes,cw,ch,maxS,padX=20,padTop=20,padBot=20){
  let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;
  for(const[x,y,z]of cubes)for(const a of[0,1])for(const b of[0,1])for(const c of[0,1]){const[px,py]=P3(x+a,y+b,z+c);mnX=Math.min(mnX,px);mxX=Math.max(mxX,px);mnY=Math.min(mnY,py);mxY=Math.max(mxY,py)}
  const s=Math.min((cw-2*padX)/(mxX-mnX),(ch-padTop-padBot)/(mxY-mnY),maxS);
  const ox=(cw-s*(mxX-mnX))/2-s*mnX,oy=padTop+((ch-padTop-padBot)-s*(mxY-mnY))/2-s*mnY;
  return{s,T:(x,y,z)=>{const[px,py]=P3(x,y,z);return[ox+px*s,oy+py*s]}}}
function setupCanvas(canvas,cw,ch){const dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.height=ch+'px';
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);return ctx}
const PAL=k=>({top:tok(`--${k}-top`),l:tok(`--${k}-l`),r:tok(`--${k}-r`)});
function paintCube(ctx,T,cube,col){const f=cubeFaces(...cube);ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.strokeStyle=tok('--cube-line');
  for(const[k,pts]of[['top',f.top],['l',f.l],['r',f.r]]){ctx.beginPath();pts.forEach((p,i)=>{const q=T(...p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=col[k];ctx.fill();ctx.stroke()}}
function badge(ctx,cx,cy,r,text,fill){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=fill||tok('--accent');ctx.fill();
  ctx.fillStyle=tok('--surface');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.round(r*1.15)}px Lexend, system-ui, sans-serif`;ctx.fillText(text,cx,cy+1)}
function drawStack(canvas,H,opt={}){
  const cubes=stackCubes(H),cw=canvas.clientWidth||400,ch=Math.round(Math.min(cw*0.8,opt.maxH||380));
  const ctx=setupCanvas(canvas,cw,ch),{s,T}=isoFit(cubes,cw,ch,58);
  const N=PAL('cube'),HL=PAL('hl'),HID=PAL('hid');
  for(const cb of cubes){const k=cb.join(',');
    const col=(opt.hidden&&opt.hidden.has(k))?HID:(opt.highlight&&opt.highlight[0]===cb[0]&&opt.highlight[1]===cb[1])?HL:N;paintCube(ctx,T,cb,col)}
  for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++){const h=H[x][y];if(!h)continue;const[cx,cy]=T(x+.5,y+.5,h),r=Math.max(9,s*.27);
    if(opt.labels)badge(ctx,cx,cy,r,h);else if(opt.letters)badge(ctx,cx,cy,r,opt.letters[x+','+y])}
}
/* Which cubes can't be seen at all: paint each cube in its own colour off-screen and count pixels */
function hiddenCubes(H){
  const cubes=stackCubes(H),cw=560,ch=480,c=document.createElement('canvas');c.width=cw;c.height=ch;
  const ctx=c.getContext('2d'),{T}=isoFit(cubes,cw,ch,64);
  cubes.forEach((cb,i)=>{const id=i+1,f=cubeFaces(...cb);ctx.fillStyle=`rgb(${id&255},${(id>>8)&255},200)`;
    for(const pts of[f.top,f.l,f.r]){ctx.beginPath();pts.forEach((p,j)=>{const q=T(...p);j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fill()}});
  const d=ctx.getImageData(0,0,cw,ch).data,cnt=new Array(cubes.length+1).fill(0);
  for(let p=0;p<d.length;p+=4){if(d[p+2]!==200||d[p+3]!==255)continue;const id=d[p]+(d[p+1]<<8);if(id>0&&id<=cubes.length)cnt[id]++}
  const hid=new Set();cubes.forEach((cb,i)=>{if(cnt[i+1]<14)hid.add(cb.join(','))});return hid}
/* Towers are read row by row: row 1 is the back-left row, then each row in front of it. */
function towerOrder(H){const k=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])k.push([x,y]);return k}
function towerRows(H){const rows=[];for(let x=0;x<H.length;x++){const r=[];for(let y=0;y<H[0].length;y++)if(H[x][y])r.push([x,y]);if(r.length)rows.push(r)}return rows}
function towerLetters(H){const m={};towerOrder(H).forEach(([x,y],i)=>m[x+','+y]='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[i]||'?');return m}
/* Each row of towers pulled apart on its own line, in its real place; gaps show as 0; hidden cubes in yellow */
function drawLineup(canvas,H,hidden,letters,only){
  const D=H[0].length,g=1.55,P=(x,y,z)=>[x-y,(x+y)/2-z];
  const rows=towerRows(H).map(r=>({x:r[0][0],r:r.filter(([x,y])=>!only||only.includes(x+','+y))})).filter(o=>o.r.length);
  const slot=(o,y)=>only?o.r.findIndex(p=>p[1]===y):y,span=o=>only?o.r.map(p=>p[1]):[...Array(D).keys()];
  const bands=rows.map(o=>{let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;span(o).forEach(y=>{const i=slot(o,y),h=H[o.x][y];for(let z=0;z<=Math.max(h,0);z++)for(const a of[0,1])for(const b of[0,1]){const[px,py]=P(i*g+a,-i*g+b,z);mnX=Math.min(mnX,px);mxX=Math.max(mxX,px);mnY=Math.min(mnY,py);mxY=Math.max(mxY,py)}});return{...o,mnX,mxX,mnY,mxY}});
  const cw=canvas.clientWidth||300,lab=46,padTop=22,gap=30,maxW=Math.max(...bands.map(b=>b.mxX-b.mnX)),sumH=bands.reduce((a,b)=>a+(b.mxY-b.mnY),0);
  const s=Math.min(34,(cw-lab-16)/maxW,(560-bands.length*(gap+padTop))/sumH),ch=Math.round(bands.reduce((a,b)=>a+(b.mxY-b.mnY)*s+padTop+gap,0));
  const ctx=setupCanvas(canvas,cw,ch),N=PAL('cube'),HID=PAL('hid'),allRows=towerRows(H);let y0=0;
  bands.forEach(B=>{const ox=lab+8-s*B.mnX,oy=y0+padTop-s*B.mnY,T=(x,y,z)=>{const[px,py]=P(x,y,z);return[ox+px*s,oy+py*s]};
    ctx.fillStyle=tok('--muted');ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='700 12px Lexend, system-ui, sans-serif';
    ctx.fillText('Row '+(allRows.findIndex(r=>r[0][0]===B.x)+1),4,oy+s*((B.mnY+B.mxY)/2));
    span(B).forEach(y=>{const i=slot(B,y),h=H[B.x][y];
      if(!h){ctx.save();ctx.setLineDash([4,3]);ctx.strokeStyle=tok('--muted');ctx.lineWidth=1.4;ctx.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach(([a,b],k)=>{const q=T(i*g+a,-i*g+b,0);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.stroke();ctx.restore();
        const[cx,cy]=T(i*g+.5,-i*g+.5,0);ctx.fillStyle=tok('--muted');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.round(Math.max(11,s*.4))}px Lexend, system-ui, sans-serif`;ctx.fillText('0',cx,cy);return}
      for(let z=0;z<h;z++)paintCube(ctx,T,[i*g,-i*g,z],hidden.has(B.x+','+y+','+z)?HID:N)});
    span(B).forEach(y=>{const i=slot(B,y),h=H[B.x][y];if(!h)return;const[tx,ty]=T(i*g+.5,-i*g+.5,h);ctx.fillStyle=tok('--ink');ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.font=`700 ${Math.round(Math.max(12,s*.45))}px Lexend, system-ui, sans-serif`;ctx.fillText(`${letters[B.x+','+y]} ${h}`,tx,ty-s*.5)});
    y0+=(B.mxY-B.mnY)*s+padTop+gap})}
function towerNotes(H,{given=null,timeout=false,wrong=null}={}){
  const hid=hiddenCubes(H),t=total(H),letters=towerLetters(H),order=towerOrder(H);
  const per=order.map(([x,y])=>{let n=0;for(let z=0;z<H[x][y];z++)if(hid.has(`${x},${y},${z}`))n++;return{k:x+','+y,L:letters[x+','+y],h:H[x][y],n}});
  const worst=per.slice().sort((a,b)=>b.n-a.n)[0],seen=t-hid.size;
  const rows=towerRows(H),rowSum=r=>r.reduce((a,[x,y])=>a+H[x][y],0);
  const sum=`<ul class="rowsum">${rows.map((r,i)=>`<li><b>Row ${i+1}:</b> ${r.map(([x,y])=>`${letters[x+','+y]}&nbsp;${H[x][y]}`).join(' + ')} = <b>${rowSum(r)}</b></li>`).join('')}</ul><p><b>Total:</b> ${rows.map(rowSum).join(' + ')} = <b>${t}</b></p>`;
  let what,trap;
  if(wrong){const w=per.filter(p=>wrong.includes(p.k));
    what=`Look at tower${w.length>1?'s':''} ${w.map(p=>`<b>${p.L}</b> (${p.h} high${p.n?`, ${p.n} hidden`:''})`).join(', ')}. In the picture on the right, the towers are pulled apart so you can see every cube.`;
    trap=w.some(p=>p.n)?`<b>Hidden supporters.</b> The yellow cubes are covered by towers in front. You can’t see them, but the cube on top can’t float, so they must be there.`:`<b>Counting levels.</b> Find the tower’s top face, then count each level down to the floor. Use a neighbouring tower to help line up the levels.`}
  else{
    what=`${timeout?'Time ran out.':`You said <b>${given}</b>.`} There are <b>${t}</b> cubes. You can see ${seen} of them${hid.size?`; the other <b>${hid.size}</b> are hidden (yellow <span class="key"></span> in the pictures)`:', nothing is hidden in this one'}.${worst&&worst.n?` Tower <b>${worst.L}</b> is ${worst.h} high, but only ${worst.h-worst.n} of its cubes show.`:''}`;
    trap=timeout?`<b>Counting one by one is slow.</b> Tower numbers are quicker: jot one number per tower on paper, row by row, then add.`:
      given<t?(hid.size?`<b>Hidden supporters.</b> You were ${t-given} short. Cubes under tall towers are covered by the towers in front. The top cube can’t float, so the ones underneath must be there.`:`<b>Adding slip.</b> You were ${t-given} short. Add the tower numbers again, one row at a time.`):
      `<b>Counting twice.</b> You were ${given-t} over. A cube seen from the front and again from the side gets counted twice. Counting each tower once, by its height, stops this.`}
  return{html:`<div class="notes"><h3>Case notes</h3>
    <div class="figs"><figure class="fig" style="margin:0"><canvas id="nA"></canvas><figcaption>Each tower gets a letter, row by row from the back</figcaption></figure>
    <figure class="fig" style="margin:0"><canvas id="nB"></canvas><figcaption>Each row pulled apart · hidden cubes in yellow · gaps are 0</figcaption></figure></div>
    <div class="nb"><h4>What happened</h4><p>${what}</p></div>
    <div class="nb trick"><h4>The trick: Tower Method, row by row</h4>${sum}<p><b>On paper:</b> write one line per row, like the list above, then add the row totals. Don’t try to hold it all in your head.</p><p><b>Odd shapes:</b> a gap in the floor is a tower of 0, so skip it. Tall towers at the front hide whole cubes behind them; the tops still show you every tower.</p><p><b>Quick elimination:</b> the cubes you can see (${seen}) are the smallest possible answer, so cross out anything lower straight away.</p></div>
    <div class="nb trap"><h4>The trap</h4><p>${trap}</p></div></div>`,
   draw:()=>{const a=$('#nA'),b=$('#nB');if(a)drawStack(a,H,{letters,hidden:hid,maxH:260});if(b)drawLineup(b,H,hid,letters,wrong)}}}
/* ============ Brick stacks: blocks that are not single cubes ============ */
/* A stack is a list of blocks; each block is a list of unit cells [x,y,z]. Every block is fully held up, and every block
   shows at least a little of itself, so the count can always be worked out from the picture. */
/* Like the exam: every stack uses ONE block shape (long bars, longer bars, or thick slabs), turned different ways. No single cubes. */
const BLOCK_SHAPES={bar:{dims:[1,1,2],name:'long bars (2 cubes long)'},bar3:{dims:[1,1,3],name:'longer bars (3 cubes long)'},slab:{dims:[1,2,2],name:'thick slabs (2 by 2)'}};
const BRICK_CFG=[{layers:2,upright:0,min:5,max:9,shapes:{bar:{w:4,d:3,fill:[.9,.7]}}},
  {layers:3,upright:.2,min:8,max:14,shapes:{bar:{w:3,d:3,fill:[.8,.6,.45]},slab:{w:4,d:4,fill:[.9,.7,.55]}}},
  {layers:4,upright:.3,min:10,max:18,shapes:{bar:{w:4,d:4,fill:[.6,.45,.35,.3]},slab:{w:5,d:4,fill:[.6,.45,.35,.3]},bar3:{w:5,d:4,fill:[.6,.45,.35,.3]}}}];
function orientations(dims,allowUp){const[a,b,c]=dims,set=new Map();
  [[a,b,c],[a,c,b],[b,a,c],[b,c,a],[c,a,b],[c,b,a]].forEach(([dx,dy,dz])=>{if(dz>1&&!allowUp)return;set.set(dx+','+dy+','+dz,[dx,dy,dz])});return[...set.values()]}
function genBrickRaw(level,shape){const C=BRICK_CFG[level];shape=shape||pick(Object.keys(C.shapes));const c={...C,...C.shapes[shape]},dims=BLOCK_SHAPES[shape].dims,occ=new Map(),blocks=[],K=(x,y,z)=>x+','+y+','+z;
  const free=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<c.w&&y<c.d&&z<c.layers&&!occ.has(K(x,y,z)),held=(x,y,z)=>z===0||occ.has(K(x,y,z-1));
  for(let z=0;z<c.layers;z++){const cells=shuffle([...Array(c.w*c.d).keys()].map(i=>[i%c.w,Math.floor(i/c.w)]));
    for(const[x,y]of cells){if(!free(x,y,z)||!held(x,y,z)||Math.random()>c.fill[z])continue;
      const ors=shuffle(orientations(dims,Math.random()<c.upright));
      for(const[dx,dy,dz]of ors){let placed=false;for(const[ox,oy]of shuffle([[0,0],[1-dx,0],[0,1-dy],[1-dx,1-dy]])){
          const cs=[];for(let i=0;i<dx;i++)for(let j=0;j<dy;j++)for(let k=0;k<dz;k++)cs.push([x+ox+i,y+oy+j,z+k]);
          if(cs.every(p=>free(...p))&&cs.filter(p=>p[2]===z).every(p=>held(...p))){cs.forEach(p=>occ.set(K(...p),blocks.length));blocks.push(cs);placed=true;break}}
        if(placed)break}}}
  return{w:c.w,d:c.d,blocks,occ,shape}}
/* sample what the viewer sees of each block */
function brickSight(S){const P=(x,y,z)=>[x-y,(x+y)/2-z],cubes=[];S.blocks.forEach((b,bi)=>b.forEach(c=>cubes.push({c,bi})));
  cubes.sort((a,b)=>(a.c[0]+a.c[1]+a.c[2])-(b.c[0]+b.c[1]+b.c[2])||a.c[2]-b.c[2]);
  const polys=cubes.map(({c})=>{const f=cubeFaces(...c);return[f.top,f.l,f.r].map(pts=>pts.map(p=>P(...p)))});
  const inside=(q,poly)=>{let sgn=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],cr=(b[0]-a[0])*(q[1]-a[1])-(b[1]-a[1])*(q[0]-a[0]);if(Math.abs(cr)<1e-9)continue;const s2=Math.sign(cr);if(sgn&&s2!==sgn)return false;sgn=s2}return true};
  const vis=S.blocks.map(()=>({n:0,pts:[]})),G=[.2,.5,.8];
  cubes.forEach(({c:[x,y,z],bi},i)=>{const faces=[u=>[x+u[0],y+u[1],z+1],u=>[x+u[0],y+1,z+u[1]],u=>[x+1,y+u[0],z+u[1]]];
    faces.forEach((F,fi)=>G.forEach(u=>G.forEach(v=>{const p=F([u,v]),q=P(...p);let hid=false;for(let j=i+1;j<cubes.length&&!hid;j++){if(cubes[j].bi===bi)continue;for(const poly of polys[j])if(inside(q,poly)){hid=true;break}}
      if(!hid){vis[bi].n++;vis[bi].pts.push({p,fi})}})))});
  return vis}
function genBricks(level){const c=BRICK_CFG[level],shape=pick(Object.keys(c.shapes));let best=null,alt=null;
  for(let t=0;t<1500;t++){const S=genBrickRaw(level,shape);const n=S.blocks.length;if(n>c.max)continue;
    const vis=brickSight(S);if(vis.some(v=>v.n<3))continue;S.vis=vis;S.peek=vis.map((v,i)=>v.n<=8?i:-1).filter(i=>i>=0);
    if(n<c.min){if(!alt||n>alt.blocks.length)alt=S;continue}
    if(level>0&&!S.peek.length){best=best||S;continue}return S}
  if(best||alt)return best||alt;const F=genBrickRaw(level,shape);F.vis=brickSight(F);F.peek=[];return F}
/* draw: each block drawn as one solid piece, only its outline edges stroked. opt.layer draws one layer on its own, set on the floor. */
function drawBricks(canvas,S,opt={}){const P=(x,y,z)=>[x-y,(x+y)/2-z],K=(x,y,z)=>x+','+y+','+z,cubes=[],dz=opt.layer||0;

    o+=`<line x1="${ex-d[1]*h}" y1="${ey-d[0]*h}" x2="${ex+d[1]*h}" y2="${ey+d[0]*h}" stroke="${BUDDY}" stroke-width="5" stroke-linecap="round"/>`});

const relE=(e,g)=>{const m=SYM[e.sym].m,M=[0,1,2].map(i=>m[0]*e.right[i]+m[1]*e.down[i]),t=dot(M,g.d);return t>.6?'toward':t<-.6?'away':'side'};
const relText={toward:'points toward',away:'points away from',side:'runs alongside'};

/* ============ Drone view maths ============ */
function genDrone(lvl){
  for(let t=0;t<300;t++){
    const H=genStack(lvl),fp=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])fp.push([y,x]);
    const rotK=new Set([0,1,2,3].map(k=>{let c=fp;for(let i=0;i<k;i++)c=c.map(([r,cc])=>[cc,-r]);return keyOf(c)}));
    const has=(c,p)=>c.some(q=>q[0]===p[0]&&q[1]===p[1]);
    const R=Math.max(...fp.map(p=>p[0])),C=Math.max(...fp.map(p=>p[1]));
    const extras=()=>{const out=[];fp.forEach(([r,c])=>DIRS.forEach(([dr,dc])=>{const p=[r+dr,c+dc];if(p[0]>=0&&p[1]>=0&&p[0]<=R+1&&p[1]<=C+1&&!has(fp,p)&&!has(out,p))out.push(p)}));return out};
    const make={mirror:()=>fp.map(([r,c])=>[r,C-c]),
      extra:()=>{const e=extras();return e.length?[...fp,pick(e)]:null},
      missing:()=>{if(fp.length<4)return null;const minH=Math.min(...fp.map(([r,c])=>H[c][r]));const k=pick(fp.filter(([r,c])=>H[c][r]===minH));return fp.filter(p=>p!==k)},
      shift:()=>{const e=extras();if(!e.length||fp.length<4)return null;const k=pick(fp);return[...fp.filter(p=>p!==k),pick(e)]}};
    const correct={cells:fp,kind:'ok'},seen=new Set([keyOf(fp)]),opts=[correct];
    for(const kind of shuffle(['mirror','extra','missing','shift'])){if(opts.length===4)break;
      for(let k=0;k<20;k++){const c=make[kind]();if(!c)break;const key=keyOf(c);if(rotK.has(key)||seen.has(key))continue;seen.add(key);opts.push({cells:c,kind});break}}
    if(opts.length===4){const sh=shuffle(opts);return{H,fp,opts:sh,ans:sh.indexOf(correct),W:C+1,D:R+1}}}
  return null}
function gridSVG(cells,{g=24,extra=[],missing=[],letters=null,H=null}={}){
  const all=[...cells,...missing],R=Math.max(...all.map(p=>p[0]))+1,C=Math.max(...all.map(p=>p[1]))+1,pad=3;
  const isIn=(arr,p)=>arr.some(q=>q[0]===p[0]&&q[1]===p[1]);
  let o=`<svg viewBox="0 0 ${C*g+pad*2} ${R*g+pad*2}" width="${C*g+pad*2}" style="max-width:100%;display:block;margin:0 auto">`;
  cells.forEach(([r,c])=>{const bad=isIn(extra,[r,c]);o+=`<rect x="${pad+c*g}" y="${pad+r*g}" width="${g}" height="${g}" fill="${bad?'var(--bad-soft)':'var(--cube-l)'}" stroke="${bad?'var(--bad)':'var(--ink)'}" stroke-width="${bad?3:1.4}"/>`;
    if(letters)o+=`<text x="${pad+c*g+g/2}" y="${pad+r*g+g/2+1}" text-anchor="middle" dominant-baseline="middle" font-size="${g*.42}" font-weight="700" fill="var(--ink)">${letters[c+','+r]||''}</text>`});
  missing.forEach(([r,c])=>{o+=`<rect x="${pad+c*g+2}" y="${pad+r*g+2}" width="${g-4}" height="${g-4}" fill="none" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="5 4"/>`});
  return o+'</svg>'}
/* ============ Week 2 case notes ============ */
const LET='ABCDE';
function edgeNotes(E,i){
  const o=E.options[i],face=fold(E.cells).face,fill={},stroke={},nm=s=>SYM[s].name;
  E.cells.forEach(([r,c],k)=>fill[r+','+c]=PAIRCOL[face[k]]);
  let what,trap,hot=-1,fig2='',figAns=null;
  let netOpt={};
  if(o.kind==='orient'){const j=o.info.face;hot=j;const e=o.view[j],b=o.base[j];
    const gs=[0,1,2].filter(x=>x!==j&&relE(b,o.base[x])!==relE(e,o.view[x]));const g=gs.find(x=>relE(b,o.base[x])!=='side')??gs[0];const gn=nm(o.view[g].sym),sn=nm(e.sym),ft=SYM[e.sym].feat;
    const Fj=E.F[b.cell],Fg=E.F[o.base[g].cell],dir=(F,n)=>[Math.round(dot(F.right,n)),Math.round(dot(F.down,n))];
    netOpt={edges:[{k:b.cell,d:dir(Fj,Fg.n)},{k:o.base[g].cell,d:dir(Fg,Fj.n)}],arrow:{k:b.cell,col:'var(--good)'}};
    const rb=relE(b,o.base[g]),re=relE(e,o.view[g]),word={toward:'points at',away:'points away from',side:'runs along'};
    what=`The ${sn} is turned the wrong way. Here’s how to see it:<ol class="steps">
      <li><b>On the net,</b> find the blue edge: it’s where the ${sn} square meets the ${gn} square when the net folds up (both blue edges join). The ${sn}’s ${ft} (green arrow) ${word[rb]} that edge.</li>
      <li><b>On the real cube,</b> the blue edge is the line where the ${sn} face and the ${gn} face meet. Folding never changes which edge a symbol points at, so the ${ft} still ${word[rb]} it.</li>
      <li><b>In answer ${LET[i]},</b> the ${ft} (red arrow) ${word[re]} the blue edge instead. So the ${sn} has been turned: cross it out.</li></ol>
      <b>Say it in a few words: “${ft} ${{toward:'touches',away:'away from',side:'along'}[rb]} ${gn}”.</b> Say it on the net, then check it on each cube.${SYM[e.sym].chiral?` For a flag or an L, also check it isn’t flipped: walk along the ${sn==='flag'?'pole':'upright stroke'} towards the ${sn==='flag'?'flag':'foot'}. Is it sticking out to your left or your right? Turning never changes that, only a mirror does.`:''}`;
    trap=`<b>Right faces, wrong turn.</b> All three faces really are neighbours, so it looks right. That’s why this is the commonest trap. Pick one edge buddy and check which way it points.`;
    fig2=`<figure class="fig" style="margin:0">${cubeSVG(o.base,{s:58,hot:j,hotCol:'var(--good)',edge:[j,g],arrow:j})}<figcaption>How it really looks</figcaption></figure>`;
    figAns=cubeSVG(o.view,{s:58,hot,edge:[j,g],arrow:j,arrowCol:'var(--bad)'})}
  else if(o.kind==='opposite'){const a=o.view[o.info.a],b=o.view[o.info.b];hot=o.info.b;
    E.cells.forEach(([r,c],k)=>{if(k===a.cell||k===b.cell)stroke[r+','+c]='var(--bad)'});
    what=`It shows the ${nm(a.sym)} and the ${nm(b.sym)} together, but on the net they are opposite each other (same colour, outlined in red). Opposite faces can never be seen at the same time.`;
    trap=`<b>Two faces that can’t meet.</b> Find the three opposite pairs on the net before you look at the cubes. Then any cube showing a pair together is out straight away.`}

    <figure class="fig" style="margin:0">${figAns||cubeSVG(o.view,{hot})}<figcaption>Your answer ${LET[i]}</figcaption></figure>${fig2}</div>
    <div class="nb"><h4>What happened</h4><p>${what}</p></div>
    <div class="nb trick"><h4>The trick: rule out in this order</h4><ul class="checks">${step('dud','1. Duds: any symbol not on the net, or flipped?')}${step('opp','2. Opposites: two same-colour faces together?')}${step('way','3. Edge buddies: is every symbol turned the right way?')}<li><span class="s">↻</span><span>4. Corner check, if two are left: when three faces make an L on the net, go clockwise round their shared corner. On the cube, go clockwise round the corner nearest you (top, right, left). The order must match. <span class="muted">This catches a mirror-image cube.</span></span></li></ul></div>
    <div class="nb trap"><h4>The trap</h4><p>${trap}</p></div></div>`}}
function droneNotes(D,i){
  const o=D.opts[i],letters=towerLetters(D.H),isIn=(a,p)=>a.some(q=>q[0]===p[0]&&q[1]===p[1]);
  const extra=o.cells.filter(p=>!isIn(D.fp,p)),missing=D.fp.filter(p=>!isIn(o.cells,p));
  let what,trap,mine;
  if(o.kind==='mirror'){mine=gridSVG(o.cells);
    what=`Answer ${LET[i]} is the real view flipped, like seeing it in a mirror. It has the right number of squares, but the gaps are on the wrong side.`;
    trap=`<b>A mirror image.</b> Turning a shape round can never give you its mirror image. Check which side the gap or step is on.`}
  else{mine=gridSVG(o.cells.filter(p=>isIn(D.fp,p)||isIn(extra,p)),{extra,missing});
    if(o.kind==='extra'){what=`Answer ${LET[i]} has an extra square (red). No tower stands there.`;
      trap=`<b>An extra square.</b> Count the width and depth first: the real view is ${D.W} wide and ${D.D} deep. Then check every square has a tower.`}
    else if(o.kind==='missing'){what=`Answer ${LET[i]} is missing a square (dashed). Every tower makes one square from above, even a short one.`;
      trap=`<b>A forgotten short tower.</b> Low towers are easy to miss next to tall ones. From above, height doesn’t matter: one tower, one square.`}
    else{what=`In answer ${LET[i]} one square has moved: red is a square with no tower, dashed is a tower with no square.`;
      trap=`<b>A moved square.</b> The count is right, so it looks right. Check where each gap is, not just how many squares there are.`}}
  return{html:`<div class="notes"><h3>Case notes</h3><div class="figs">
    <figure class="fig" style="margin:0"><canvas id="nA"></canvas><figcaption>Each tower has a letter</figcaption></figure>
    <figure class="fig" style="margin:0">${gridSVG(D.fp,{g:34,letters})}<figcaption>The real view from above: one square per tower</figcaption></figure>
    <figure class="fig" style="margin:0">${mine.replace('width="','data-w="')}<figcaption>Your answer ${LET[i]}</figcaption></figure></div>
    <div class="nb"><h4>What happened</h4><p>${what}</p></div>
    <div class="nb trick"><h4>The trick: drone view</h4><p>1. Count width × depth: here ${D.W} × ${D.D}. Cross out any answer that’s a different size. 2. One tower = one square; heights don’t matter. 3. Check where the gaps are.</p></div>
    <div class="nb trap"><h4>The trap</h4><p>${trap}</p></div></div>`,
    draw:()=>{const a=$('#nA');if(a)drawStack(a,D.H,{letters,maxH:240})}}}

const BK_PREFIX='CUBEDETECTIVE1:';
function makeBackup(){const data={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('cd_'))data[k]=localStorage.getItem(k)}}catch(e){}
  return BK_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,saved:new Date().toISOString(),data}))))}
function readBackup(code){code=(code||'').trim().replace(/\s+/g,'');if(!code.startsWith(BK_PREFIX))throw new Error('That isn’t a Cube Detective backup code. It should start with CUBEDETECTIVE1:');
  const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(BK_PREFIX.length)))));if(!o||typeof o.data!=='object')throw new Error('The code is damaged. Copy the whole code and try again.');return o}
function wireBackup(){
  $('#bk').onclick=()=>{const code=makeBackup(),out=$('#bkout');out.value=code;out.hidden=false;$('#bkcopy').hidden=false;if(location.hostname.endsWith('github.io'))$('#bkfile').hidden=false;
    $('#bkm').textContent='Backup made. Copy it somewhere safe, such as an email or note to yourself.';out.focus();out.select()};
  $('#bkcopy').onclick=()=>{const out=$('#bkout');const fall=()=>{out.focus();out.select();$('#bkm').textContent='Selected. Press Ctrl+C to copy.'};

  $('#bkfile').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#bkout').value],{type:'text/plain'}));a.download=`cube-detective-backup-${today()}.txt`;document.body.appendChild(a);a.click();a.remove()};
  const f=$('#rsfile');if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{$('#rsin').value=String(rd.result||'');$('#rsm').textContent='File loaded. Tap Restore progress.'};rd.readAsText(file)};
  let armed=null;$('#rs').onclick=()=>{let o;try{o=readBackup($('#rsin').value)}catch(e){$('#rsm').textContent=e.message;armed=null;return}
    const when=new Date(o.saved).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    if(armed!==$('#rsin').value){armed=$('#rsin').value;$('#rs').textContent='Tap again to replace progress';$('#rsm').textContent=`Backup from ${when}. This replaces the progress in this browser.`;return}
    try{const cur=rewards();try{const bk=JSON.parse(o.data.cd_rw||'null');if(bk){bk.given=Math.max(bk.given||0,cur.given||0);o.data.cd_rw=JSON.stringify(bk)}}catch(e){}
      const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('cd_'))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k));
      Object.entries(o.data).forEach(([k,v])=>{if(k.startsWith('cd_'))localStorage.setItem(k,v)})}catch(e){$('#rsm').textContent='This browser blocked saving. Try a normal (not private) window.';return}
    try{const raw=store.get('rw',null);if(raw&&!(raw.v>=2)){const g=raw.given||0;store.set('rw',{...raw,v:2,stamps:[],cards:(raw.cards||[]).slice(0,g),day:{}})}}catch(e){}
    home();toast(`<b>Progress restored</b> from ${when}.`,'rank')}}

const dayStr=t=>new Date(t).toISOString().slice(0,10);
function streakInfo(){const days=new Set(hist('warm').map(r=>r.d)),t=today(),T=Date.parse(t+'T12:00:00Z'),has=k=>days.has(dayStr(T-k*864e5));
  const doneToday=days.has(t);let k=doneToday?0:1,n=0;while(has(k)){n++;k++}
  const all=[...days].sort();let best=0,run=0,prev=null;all.forEach(d=>{const x=Date.parse(d+'T12:00:00Z');run=prev!=null&&x-prev===864e5?run+1:1;best=Math.max(best,run);prev=x});
  const week=Array.from({length:7},(_,i)=>{const d=dayStr(T-(6-i)*864e5);return{d,on:days.has(d),today:d===t}});
  return{n,best,doneToday,week}}
const STREAK_GOALS=[3,7,14,21];

const CASE_TYPES={rot:['rot'],tower:['count'],brick:['brick'],impostor:['impostor'],hunt:['impostor'],opp:['opp'],edge:['edge'],drone:['drone'],elim:['edge','drone']};
const TRICK={rot:'Count the cubes first. Then pick one end cube and check it’s joined the same way, on the same side. If it sticks out the other side, it’s the mirror image: turning can never make that.',
  brick:'Know the block’s size first (all blocks match). Then go layer by layer on paper: count each layer’s blocks and write it down. A line across a face is where one block ends; no line means it’s the same block.',
  count:'Tower Method: on scrap paper, write each tower’s height row by row, then add the rows. The cubes you can see are the smallest possible answer.',
  impostor:'Three checks: no line of 5, no 2×2 block, and four in a line needs one wing on each side.',
  opp:'Line of three: the 1st and 3rd are opposite. Z shape: the two ends are opposite, however long the middle. Touching squares are never opposite.',
  edge:'Rule out in order: duds, then opposites shown together, then edge buddies. Edge buddies: on the net, say which neighbour the point touches (“tip touches circle”), then check the same on each cube. Draw a little arrow on the tip if it helps. Flag or L: walk along the pole or upright: is it sticking out left or right? Turning never changes that. Two left? Corner check: go clockwise round the corner, and the faces must come in the same order as on the net.',
  drone:'Count width × depth first. One tower = one square, heights don’t matter. Check where the gaps are; flipped is always wrong.'};
const WHY={rot:'Every rotation question hides a mirror image that looks exactly right at a glance. Tracking one end cube is the only quick way to catch it.',
  brick:'A big block shows three faces, so it’s easy to count it twice, and blocks tucked behind others are easy to miss. Knowing the block size and counting layer by layer means every block is counted exactly once.',
  count:'The answer options are usually just 1 or 2 apart, set to catch anyone who misses a hidden cube. The Tower Method counts every hidden cube, so it turns a close guess into a sure mark.',
  impostor:'Test-setters often put exactly the right symbols on a net that can’t fold. If you check the shape first, those options are gone in a few seconds, before you even look at the symbols.',
  opp:'Opposites are the fastest way to cut down a nets question: any cube showing an opposite pair together is wrong. Spot the pairs first and you can often cross out two options straight away.',
  edge:'The commonest trap shows three faces that really are neighbours, but with one symbol turned the wrong way. It looks right, so only checking an edge buddy catches it. Folding never changes which edge a symbol points at, so one quick check of the tip settles it.',
  drone:'Wrong views are usually the right shape flipped, or with one square added, missing or moved. Counting width × depth and checking the gaps catches them in seconds.'};
const ruleBox=(t,lead)=>`<div class="rulebox"><h4>${lead||'Rule to remember'}: ${TYPE_NAME[t]}</h4><p class="rb-rule">${TRICK[t]}</p><p class="rb-why"><b>Why it matters:</b> ${WHY[t]}</p></div>`;
function learnedTypes(){const h=store.get('hist',{}),out=new Set();Object.entries(CASE_TYPES).forEach(([id,ts])=>{if((h[id]||[]).length||(id==='hunt'&&store.get('found',[]).length))ts.forEach(t=>out.add(t))});
  return['count','brick','impostor','opp','edge','drone','rot'].filter(t=>out.has(t))}
function lastDayTypes(){const h=store.get('hist',{}),t=today();let best=null;const by={};
  Object.entries(CASE_TYPES).forEach(([id,ts])=>(h[id]||[]).forEach(r=>{if(r.d<t){(by[r.d]=by[r.d]||new Set());ts.forEach(x=>by[r.d].add(x));if(!best||r.d>best)best=r.d}}));
  return best?[...by[best]]:[]}
function staleTypes(types){const h=store.get('hist',{}),now=Date.parse(today());return types.filter(ty=>{let last=0;
  Object.entries(CASE_TYPES).forEach(([id,ts])=>{if(ts.includes(ty))(h[id]||[]).forEach(r=>{last=Math.max(last,Date.parse(r.d))})});return now-last>=3*864e5})}
function warmup(){const types=learnedTypes();if(!types.length)return home();

    const older=types.filter(t=>!yday.includes(t)),base=older.length?older:types,pool=[...base,...base,...types,...types.filter(t=>weak[t]),...types.filter(t=>weak[t]),...stale.filter(t=>!yday.includes(t)),...stale.filter(t=>!yday.includes(t))];
    while(out.length<6)out.push(pick(pool));const head=out.slice(0,Math.min(2,yday.length?2:0));return[...head,...shuffle(out.slice(head.length))]};
  const recall=(yday.length?yday:types).slice(0,2);

    rule:`<strong>Before you start, say ${recall.length>1?'these tricks':'this trick'} out loud. Then tap to check.</strong>

      <p style="margin:8px 0 0"><span class="pp">✎ Pen and paper ready, just like in the exam.</span> ${yday.length?'The first questions are on yesterday’s skill. Then a mix of everything you’ve learned so far.':'A mix of everything you’ve learned so far.'}</p>`})}

function tower(){
  let mode=store.get('towerMode','learn'),level=store.get('towerLevel',0);
  view.innerHTML=`<section class="sheet">

      <p style="margin:0 0 6px"><b>Use pen and paper.</b> Holding lots of numbers in your head is how mistakes happen. Jot each row’s numbers as you go, then add them up on paper.</p><ol><li>Every floor square has one tower on it. Find each tower’s top.</li><li>Write how many cubes high it is. Cubes can’t float, so the hidden ones underneath count too.</li><li>Add up one row at a time, then add the row totals.</li></ol><p style="margin:6px 0 0"><b>Odd shapes (L, U, gaps):</b> the method is the same. Find every tower top. A gap in the floor is a tower of 0. Watch for tall towers at the front: they hide whole cubes behind them.</p><p style="margin:6px 0 0"><b>Exam shortcut:</b> the cubes you can see are the smallest possible answer. Cross out any option below that first.</p></div>

function planSVG(H,vals,sel,marks){
  const s=40,P=(x,y)=>[(x-y)*s,(x+y)*s/2];let pts=[];
  for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])pts.push(P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1));
  const mnX=Math.min(...pts.map(p=>p[0]))-4,mxX=Math.max(...pts.map(p=>p[0]))+4,mnY=Math.min(...pts.map(p=>p[1]))-4,mxY=Math.max(...pts.map(p=>p[1]))+4;
  let o=`<svg class="plan" viewBox="${mnX} ${mnY} ${mxX-mnX} ${mxY-mnY}" width="${mxX-mnX}" style="max-width:100%;margin:0 auto">`;
  for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++){if(!H[x][y])continue;const k=x+','+y;
    const poly=[P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)].map(p=>p.join(',')).join(' ');
    const m=marks[k],fill=m==='ok'?'var(--good-soft)':m==='no'?'var(--bad-soft)':k===sel?'var(--hl-top)':'var(--surface)';
    const[cx,cy]=P(x+.5,y+.5);
    o+=`<polygon class="cellp" data-k="${k}" points="${poly}" fill="${fill}" stroke="${k===sel?'var(--accent)':'var(--ink)'}" stroke-width="${k===sel?3:1.4}"/>`;
    o+=`<text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="${m==='no'?'var(--bad)':'var(--ink)'}" style="pointer-events:none">${vals[k]??''}</text>`}
  return o+'</svg>'}
function towerLearn(level){
  const H=genStack(level),keys=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])keys.push(x+','+y);

  const g=$('#game');
  g.innerHTML=`<div class="stage"><div class="panel"><canvas class="stack" id="cv"></canvas>
      <div class="row"><button id="xray" class="btn-ghost">Show tower numbers</button><button id="new" class="btn-ghost">New stack</button></div></div>

      <div id="plan"></div><div class="keypad" id="kp">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>

      <div id="s2" hidden><h3>Step 2 · Add them up</h3><div class="row"><input id="tot" class="num" type="number" inputmode="numeric" min="0" aria-label="Total cubes"><button id="chk2" class="btn-primary">Check total</button></div></div>
      <div id="fb"></div></div></div><div id="notes"></div>`;
  const cv=$('#cv');
  const paint=()=>{drawStack(cv,H,{highlight:stage===1&&sel?sel.split(',').map(Number):null,labels:xray});

  $('#xray').onclick=()=>{xray=!xray;$('#xray').textContent=xray?'Hide tower numbers':'Show tower numbers';paint()};
  $('#new').onclick=()=>towerLearn(level);
  $('#chk1').onclick=()=>{
    const missing=keys.filter(k=>vals[k]==null);
    if(missing.length){$('#fb').innerHTML=`<div class="feedback no">${missing.length} tower${missing.length>1?'s':''} still blank. Every floor square needs a number.</div>`;sel=missing[0];paint();return}
    let wrong=0;keys.forEach(k=>{const[x,y]=k.split(',').map(Number);marks[k]=vals[k]===H[x][y]?'ok':'no';if(marks[k]==='no')wrong++});
    if(wrong){sel=keys.find(k=>marks[k]==='no');paint();
      const wk=keys.filter(k=>marks[k]==='no'),N=towerNotes(H,{wrong:wk});
      $('#fb').innerHTML=`<div class="feedback no">${wrong} tower${wrong>1?'s are':' is'} off (in red). Read the case notes below, fix the red numbers, then check again.</div>`;
      $('#notes').innerHTML=N.html;N.draw();redraw=()=>{paint();N.draw()}}
    else{$('#notes').innerHTML='';redraw=paint;stage=2;paint();$('#chk1').hidden=true;$('#kp').hidden=true;$('#s2').hidden=false;$('#fb').innerHTML=`<div class="feedback ok">All towers right. Now add them.</div>`;$('#tot').focus()}};
  $('#chk2').onclick=()=>{const t=total(H),v=+$('#tot').value;
    const sum=keys.map(k=>{const[x,y]=k.split(',').map(Number);return H[x][y]}).join(' + ');
    if(v===t){xray=true;paint();addPoints(15);$('#fb').innerHTML=`<div class="feedback ok"><b>Case closed: ${t} cubes.</b><br>${sum} = ${t}</div><div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">Next stack →</button></div>`;$('#nx').onclick=()=>towerLearn(level)}

function towerExam(level){

      else{const N=towerNotes(H,{given:v,timeout:v==null});

    g.querySelectorAll('.options button').forEach(b=>b.onclick=()=>finish(+b.dataset.v));
    timerId=setInterval(()=>{left-=.25;$('#bar').style.width=Math.max(0,left/SECS*100)+'%';if(left<=0)finish(null)},250);
  };

}

      g.querySelectorAll('.stamp').forEach(x=>x.disabled=true);

      if(real){const f=fold(cells).face;const col=['var(--p1)','var(--p1)','var(--p2)','var(--p2)','var(--p3)','var(--p3)'];cells.forEach(([r,c],i)=>fill[r+','+c]=col[f[i]]);

      else{const d=diagnose(cells);d.hot.forEach(([r,c])=>{fill[r+','+c]='var(--bad-soft)';stroke[r+','+c]='var(--bad)'});why=d.why}
      $('#nb').innerHTML=netSVG(cells,{fill,stroke})+`<div class="verdict ${real?'real':'fake'}">${real?'REAL':'FAKE'}</div>`;
      $('#fb').innerHTML=`<div class="feedback ${right?'ok':'no'}"><b>${right?'Correct.':'Caught you out.'}</b> ${why}</div>${right?'':netNotes(cells,{real})}<div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">${n===ROUNDS?'See score':'Next shape →'}</button></div>`;$('#nx').onclick=next});
  };
  next();
}

/* ============ Case 03: The Missing Eleven ============ */
function hunt(){
  let found=store.get('found',[]).filter(k=>NET_KEYS.includes(k));const on=new Set();
  view.innerHTML=`<section class="sheet"><div class="sheet-head"><div><div class="tag">Case 04 · Nets of cubes</div><h2>The Missing Eleven</h2></div><span class="score" id="cnt"></span></div>
    <div class="rule">Tap 6 squares to draw a net, then check it. A net that’s the same as one you’ve found, just turned or flipped, doesn’t count twice. <strong>Families:</strong> 6 × 1-4-1, 3 × 1-3-2, 1 × 2-2-2 staircase, 1 × 3-3.</div>
    <div class="stage"><div class="panel"><div class="hunt" id="grid">${[...Array(25)].map((_,i)=>`<button class="cell" id="c${i}" data-i="${i}" aria-pressed="false" aria-label="Square ${i+1}"></button>`).join('')}</div>
      <div class="row"><button class="btn-primary" id="chk" disabled>Check net</button><button class="btn-ghost" id="clr">Clear</button><span class="muted" id="n6">0 / 6 squares</span></div><div id="fb"></div></div>
      <div class="panel"><h3>Case board</h3><div class="gallery" id="gal"></div><div class="row"><button class="btn-ghost" id="rehunt">Start the hunt again</button><span class="muted" id="rehuntm"></span></div></div></div><div id="notes"></div></section>`;
  const paintGal=(flash)=>{$('#cnt').textContent=`${found.length} of 11 found`;
    $('#gal').innerHTML=NETS.map((c,i)=>{const k=NET_KEYS[i],has=found.includes(k);return`<div class="slot ${has?'found':''} ${k===flash?'flash':''}">${has?netSVG(c,{size:14}):'<span class="q">?</span>'}<small>${family(c)}</small></div>`}).join('')};
  paintGal();
  let armed=false;$('#rehunt').onclick=()=>{if(!armed){armed=true;$('#rehunt').textContent='Tap again to clear the board';$('#rehuntm').textContent='Her other progress is kept.';return}
    found=[];store.set('found',found);armed=false;$('#rehunt').textContent='Start the hunt again';$('#rehuntm').textContent='Board cleared. Find all 11 again!';paintGal()};
  const upd=()=>{$('#n6').textContent=`${on.size} / 6 squares`;$('#chk').disabled=on.size!==6};
  $('#grid').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(on.has(i))on.delete(i);else{if(on.size>=6)return;on.add(i)}b.setAttribute('aria-pressed',on.has(i));upd()});
  $('#clr').onclick=()=>{on.clear();$('#grid').querySelectorAll('.cell').forEach(b=>b.setAttribute('aria-pressed','false'));upd();$('#fb').innerHTML='';$('#notes').innerHTML=''};
  $('#chk').onclick=()=>{
    const cells=[...on].map(i=>[Math.floor(i/5),i%5]);const has=new Set(cells.map(p=>p.join(',')));
    const seen=new Set([cells[0].join(',')]),q=[cells[0]];while(q.length){const[r,c]=q.pop();for(const[dr,dc]of DIRS){const k=(r+dr)+','+(c+dc);if(has.has(k)&&!seen.has(k)){seen.add(k);q.push([r+dr,c+dc])}}}
    if(seen.size<6){$('#fb').innerHTML=`<div class="feedback no">The squares must all join edge to edge, in one piece.</div>`;return}
    const k=canon(cells);
    if(!NET_KEYS.includes(k)){$('#fb').innerHTML=`<div class="feedback no"><b>Impostor!</b> That shape can’t fold into a cube. See the case notes below.</div>`;$('#notes').innerHTML=netNotes(norm(cells),{real:false});return}
    if(found.includes(k)){$('#fb').innerHTML=`<div class="feedback no">Real net, but you already have it on the case board. Turn it or flip it in your head and you’ll see it’s the same one.</div>`;paintGal(k);return}
    found.push(k);store.set('found',found);paintGal(k);addPoints(20);checkModules();
    $('#clr').click();$('#fb').innerHTML=found.length===11?`<div class="feedback ok"><b>All 11 found. Case closed!</b></div>`:`<div class="feedback ok"><b>New net found!</b> It’s a ${family(norm(cells))}. ${11-found.length} to go.</div>`};
  upd();
}

/* ============ Case 04: Opposites ============ */
function opposites(){
  const ROUNDS=8;let n=0,score=0;QT.reset();
  view.innerHTML=`<section class="sheet"><div class="sheet-head"><div><div class="tag">Case 05 · Nets of cubes</div><h2>Opposite Suspects</h2></div><span class="score" id="sc"></span></div>
    <div class="rule"><strong>Tap the square that ends up opposite the ★.</strong><ul><li>In a straight line of three, the 1st and 3rd are opposite.</li><li>In a Z shape, the two ends are opposite, however long the middle of the Z is.</li><li>Opposite faces can never be seen together on a cube.</li></ul></div><div id="game"></div></section>`;
  const g=$('#game');
  const next=()=>{
    if(n===ROUNDS){const avg=QT.avg();record('opp',score,ROUNDS,0,avg);g.innerHTML=`<div class="done"><div class="big">${score} / ${ROUNDS}</div>${speedLine('opp',score,ROUNDS,avg)}<p>${score>=7?'Opposites spotted every time.':'Look for straight lines of three first. They give the answer fastest.'}</p><button class="btn-primary" id="again">Play again</button></div>`;$('#again').onclick=opposites;return}
    n++;$('#sc').textContent=`Round ${n} of ${ROUNDS} · Score ${score}`;
    const cells=randomPose(pick(NETS)),f=fold(cells).face,s=rnd(6),ans=f.findIndex(x=>x===(f[s]^1));
    const star={[cells[s].join(',')]:'★'};
    g.innerHTML=`<div class="netbox" id="nb">${netSVG(cells,{marks:star,click:true,size:54})}</div><div id="fb"></div>`;QT.start();
    $('#nb').querySelectorAll('rect[data-i]').forEach(r=>r.onclick=()=>{
      const i=+r.dataset.i;if(i===s)return;QT.stop();const ok=i===ans;if(ok)score++;$('#sc').textContent=`Round ${n} of ${ROUNDS} · Score ${score}`;
      const col=['var(--p1)','var(--p1)','var(--p2)','var(--p2)','var(--p3)','var(--p3)'],fill={},stroke={};cells.forEach(([r2,c2],j)=>fill[r2+','+c2]=col[f[j]]);
      if(!ok)stroke[cells[i].join(',')]='var(--bad)';
      $('#nb').innerHTML=netSVG(cells,{marks:star,fill,stroke,size:54});
      $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not that one.'}</b> Same colours are opposite pairs. Every net has exactly three pairs.</div>${ok?'':oppNotes(cells,f,s,ans,i)}<div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">${n===ROUNDS?'See score':'Next →'}</button></div>`;$('#nx').onclick=next});
  };
  next();
}
home();
</script>
