<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Detective</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Lexend:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
/* Layout: a detective's desk. Case-file folders on the home screen; each case is one focused working sheet. */
:root{
  --bg:#E9ECF2; --surface:#FFFFFF; --ink:#1B2333; --muted:#596579; --line:#D3D9E4;
  --folder:#E3C07E; --folder-ink:#4A3510; --accent:#2B57D0; --accent-soft:#E3EAFB;
  --good:#17804A; --good-soft:#DDF2E6; --bad:#C33227; --bad-soft:#FBE3E0;
  --cube-top:#FBFCFE; --cube-l:#CBD3E2; --cube-r:#A8B4CA; --cube-line:#1B2333;
  --hl-top:#BFD0FA; --hl-l:#8EA9EF; --hl-r:#6E8EE3;
  --hid-top:#FFD970; --hid-l:#EDB93F; --hid-r:#CC9524;
  --p1:#F5C542; --p2:#6CC4A1; --p3:#F08A7E;
  --font-display:"Special Elite","Courier New",monospace;
  --font-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2C3445;
  --folder:#B38E4B; --folder-ink:#1E1607; --accent:#86A6FF; --accent-soft:#222E4D;
  --good:#4CC985; --good-soft:#163526; --bad:#FF7468; --bad-soft:#3C1D1B;
  --cube-top:#3B4661; --cube-l:#2B3449; --cube-r:#212939; --cube-line:#C7D0E2;
  --hl-top:#4E6AB8; --hl-l:#3A549A; --hl-r:#2E4580;
  --hid-top:#C49A2E; --hid-l:#9C7820; --hid-r:#7A5D17;
  --p1:#C99C24; --p2:#3E9C78; --p3:#C8645A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A202C; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2C3445;
  --folder:#B38E4B; --folder-ink:#1E1607; --accent:#86A6FF; --accent-soft:#222E4D;
  --good:#4CC985; --good-soft:#163526; --bad:#FF7468; --bad-soft:#3C1D1B;
  --cube-top:#3B4661; --cube-l:#2B3449; --cube-r:#212939; --cube-line:#C7D0E2;
  --hl-top:#4E6AB8; --hl-l:#3A549A; --hl-r:#2E4580;
  --hid-top:#C49A2E; --hid-l:#9C7820; --hid-r:#7A5D17;
  --p1:#C99C24; --p2:#3E9C78; --p3:#C8645A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,5vw,2.3rem);margin:0;letter-spacing:.02em;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.92rem}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn-ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
/* home */
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;margin-top:8px}
.folder{position:relative;text-align:left;background:var(--folder);color:var(--folder-ink);border:none;border-radius:4px 12px 12px 12px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:8px;min-height:170px}
.folder::before{content:attr(data-tab);position:absolute;top:-20px;left:0;background:var(--folder);border-radius:8px 8px 0 0;padding:2px 14px;font-family:var(--font-display);font-size:.85rem;letter-spacing:.06em}
.folder:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.folder h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.45rem}
.folder p{margin:0;font-size:.93rem}
.folder .meta{margin-top:auto;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.motto{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px;font-size:.95rem}
.motto b{font-family:var(--font-display);font-weight:400;font-size:1.05rem}
/* case sheet */
.sheet{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sheet-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.6rem;line-height:1.15}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rule{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.rule ol,.rule ul{margin:6px 0 0;padding-left:20px}
.rule strong{color:var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 14px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:680px){.stage{grid-template-columns:minmax(0,1fr)}}
canvas.stack{width:100%;display:block;background:var(--bg);border-radius:10px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:1rem}
svg{display:block;max-width:100%}
.plan .cellp{cursor:pointer}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keypad button{padding:10px 0;font-weight:600;font-variant-numeric:tabular-nums}
input.num{font-family:inherit;font-size:1.3rem;width:110px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.feedback{border-radius:10px;padding:12px 14px;font-size:.95rem}
.feedback.ok{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.options button{font-size:1.25rem;font-weight:600;padding:14px 0;font-variant-numeric:tabular-nums}
.options button.right{background:var(--good-soft);border-color:var(--good)}
.options button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stamp{font-family:var(--font-display);font-size:1.6rem;padding:16px 0;border-width:3px;letter-spacing:.12em}
.stamp.real{color:var(--good);border-color:var(--good)}
.stamp.fake{color:var(--bad);border-color:var(--bad)}
.netbox{display:flex;justify-content:center;padding:16px;background:var(--bg);border-radius:10px;min-height:220px;align-items:center;position:relative}
.verdict{position:absolute;top:12px;right:12px;font-family:var(--font-display);font-size:1.5rem;padding:4px 12px;border:3px solid currentColor;border-radius:6px;transform:rotate(-8deg);background:var(--surface)}
.verdict.real{color:var(--good)}.verdict.fake{color:var(--bad)}
.hunt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:min(100%,300px);aspect-ratio:1;max-width:100%}
.cell{border:1.5px dashed var(--line);background:var(--bg);border-radius:4px;padding:0}
.cell[aria-pressed="true"]{background:var(--accent);border:1.5px solid var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center;background:var(--bg)}
.slot.found{background:var(--surface);border-color:var(--good)}
.slot small{font-size:.72rem;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.slot .q{font-family:var(--font-display);font-size:1.8rem;color:var(--muted)}
.slot.flash{animation:flash 1s ease}
@keyframes flash{0%{transform:scale(1.12);box-shadow:0 0 0 4px var(--good)}100%{transform:none}}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:18px 0}
.done .big{font-family:var(--font-display);font-size:2.4rem}
.notes{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.notes>h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.nb{display:flex;flex-direction:column;gap:6px}
.nb h4{margin:0;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nb p{margin:0}
.nb.trick{border-left:4px solid var(--accent);padding-left:12px}
.nb.trap{border-left:4px solid var(--bad);padding-left:12px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.fig{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.fig canvas{width:100%;display:block}
.fig figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks .y{color:var(--good);font-weight:700}.checks .n{color:var(--bad);font-weight:700}.checks .s{color:var(--muted);font-weight:700}
.key{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;background:var(--hid-top);border:1px solid var(--cube-line)}
.qtext{margin:0;font-weight:600}
.copts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.copts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.copts,.copts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.copt{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.copt .pick{width:100%;padding:24px 6px 8px;position:relative;min-height:110px;display:flex;align-items:center;justify-content:center}
.copt .lbl{position:absolute;top:5px;left:8px;font-weight:700;font-size:.85rem;color:var(--muted)}
.copt .xo{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:.8rem;border-radius:8px}
.copt.out .pick{opacity:.35}
.copt.out .pick::after{content:"";position:absolute;inset:10% 10%;background:linear-gradient(to top right,transparent calc(50% - 2px),var(--bad) calc(50% - 2px),var(--bad) calc(50% + 2px),transparent calc(50% + 2px))}
.copt.right .pick{border-color:var(--good);background:var(--good-soft);opacity:1}
.copt.wrong .pick{border-color:var(--bad);background:var(--bad-soft)}
.why{display:flex;flex-wrap:wrap;gap:4px}
.why button{padding:6px 8px;font-size:.82rem;flex:1 1 auto}
.tagr{font-size:.78rem;font-weight:700;color:var(--bad);text-align:center;min-height:1em}
.tablewrap{overflow-x:auto}
table.res{border-collapse:collapse;width:100%;font-size:.92rem}
table.res th,table.res td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.res td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.y{color:var(--good);font-weight:700}.n{color:var(--bad);font-weight:700}.s{color:var(--muted);font-weight:700}
.week{display:flex;flex-direction:column;gap:14px}
.wk{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:10px 0 0;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.folder.sealed{background:var(--line);color:var(--muted);cursor:default}
.folder.sealed::before{background:var(--line)}
.folder.sealed:hover{transform:none;box-shadow:none}
.classified{align-self:flex-start;font-family:var(--font-display);color:var(--bad);border:2.5px solid var(--bad);padding:2px 10px;transform:rotate(-4deg);letter-spacing:.12em}
.chip{position:absolute;top:12px;right:12px;background:var(--bad);color:var(--surface);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.gate{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.gate.ready{border:2px solid var(--accent)}.gate.passed{border:1.5px solid var(--good)}
.gate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.gate h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.warm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.warm h3{margin:0 0 2px;font-size:1.05rem}
.warm>div{flex:1 1 260px;min-width:0}
.parent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.parent summary{cursor:pointer;font-weight:600}
.parent .row{margin-top:8px}
.collection{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.col-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col-head>div{flex:1 1 220px;min-width:0}
.collection h3{margin:2px 0 6px;font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.rankbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.rankbar i{display:block;height:100%;background:var(--folder)}
.stampmeter{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stampmeter p{flex-basis:100%}
.st{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--line);font-size:1.1rem}
.st.on{border:2px solid var(--bad);color:var(--bad);transform:rotate(-8deg)}
.col-cards{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.owed{background:var(--folder);color:var(--folder-ink);font-weight:700;padding:4px 10px;border-radius:999px}
.collection summary{cursor:pointer;font-weight:600;font-size:.92rem}
.howto{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
input.num.small{width:70px;font-size:1rem;padding:6px 8px}
#toasts{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:20}
.toast{background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;max-width:min(100%,460px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s ease}
.toast span{opacity:.8}
.toast.card{background:var(--folder);color:var(--folder-ink);font-size:1.05rem}
.toast.rank{background:var(--accent);color:var(--surface)}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.folder:hover{transform:none}}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand">
      <h1>Cube Detective</h1>
      <p>Rule options out. Then pick.</p>
    </div>
    <button id="homeBtn" class="btn-ghost" hidden>← All case files</button>
  </header>
  <main id="view"></main>
</div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const view=$('#view');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem('cd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('cd_'+k,JSON.stringify(v))}catch(e){}}};
let redraw=null, timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>redraw&&redraw())}catch(e){}
new MutationObserver(()=>redraw&&redraw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',()=>redraw&&redraw());
$('#homeBtn').onclick=()=>home();

/* ============ 3D stack drawing ============ */
const P3=(x,y,z)=>[x-y,(x+y)/2-z];
function cubeFaces(x,y,z){return{top:[[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],l:[[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]],r:[[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]]}}
function stackCubes(H){const c=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)for(let z=0;z<H[x][y];z++)c.push([x,y,z]);
  return c.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2])}
function isoFit(cubes,cw,ch,maxS,padX=20,padTop=20,padBot=20){
  let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;
  for(const[x,y,z]of cubes)for(const a of[0,1])for(const b of[0,1])for(const c of[0,1]){const[px,py]=P3(x+a,y+b,z+c);mnX=Math.min(mnX,px);mxX=Math.max(mxX,px);mnY=Math.min(mnY,py);mxY=Math.max(mxY,py)}
  const s=Math.min((cw-2*padX)/(mxX-mnX),(ch-padTop-padBot)/(mxY-mnY),maxS);
  const ox=(cw-s*(mxX-mnX))/2-s*mnX,oy=padTop+((ch-padTop-padBot)-s*(mxY-mnY))/2-s*mnY;
  return{s,T:(x,y,z)=>{const[px,py]=P3(x,y,z);return[ox+px*s,oy+py*s]}}}
function setupCanvas(canvas,cw,ch){const dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.height=ch+'px';
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);return ctx}
const PAL=k=>({top:tok(`--${k}-top`),l:tok(`--${k}-l`),r:tok(`--${k}-r`)});
function paintCube(ctx,T,cube,col){const f=cubeFaces(...cube);ctx.lineWidth=1.6;ctx.lineJoin='round';ctx.strokeStyle=tok('--cube-line');
  for(const[k,pts]of[['top',f.top],['l',f.l],['r',f.r]]){ctx.beginPath();pts.forEach((p,i)=>{const q=T(...p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=col[k];ctx.fill();ctx.stroke()}}
function badge(ctx,cx,cy,r,text,fill){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=fill||tok('--accent');ctx.fill();
  ctx.fillStyle=tok('--surface');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.round(r*1.15)}px Lexend, system-ui, sans-serif`;ctx.fillText(text,cx,cy+1)}
function drawStack(canvas,H,opt={}){
  const cubes=stackCubes(H),cw=canvas.clientWidth||400,ch=Math.round(Math.min(cw*0.8,opt.maxH||380));
  const ctx=setupCanvas(canvas,cw,ch),{s,T}=isoFit(cubes,cw,ch,58);
  const N=PAL('cube'),HL=PAL('hl'),HID=PAL('hid');
  for(const cb of cubes){const k=cb.join(',');
    const col=(opt.hidden&&opt.hidden.has(k))?HID:(opt.highlight&&opt.highlight[0]===cb[0]&&opt.highlight[1]===cb[1])?HL:N;paintCube(ctx,T,cb,col)}

/* ============ Drone view maths ============ */
function genDrone(lvl){
  for(let t=0;t<300;t++){
    const H=genStack(lvl),fp=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])fp.push([y,x]);

/* ============ Week 2 case notes ============ */
const LET='ABCDE';
function edgeNotes(E,i){

    <div class="row"><label for="spc">Stamps per card</label><input class="num small" id="spc" type="number" min="1" max="10" value="${rwSettings().spc}"><label for="lim">Card limit</label><input class="num small" id="lim" type="number" min="1" max="99" value="${rwSettings().limit}"></div>
    <div class="row"><button id="pu">Unlock next week now</button><span class="muted" id="puc"></span></div>
    <div class="row"><button id="pr">Reset all progress</button><span class="muted" id="prc"></span></div></details>`;
  view.querySelectorAll('.folder[data-id]').forEach(b=>b.onclick=()=>{inCase=true;if(b.dataset.id==='mock')return mock();const c=CASES.find(x=>x.id===b.dataset.id);$('#homeBtn').hidden=false;c.go();scrollTo(0,0)});
  view.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{inCase=true;checkpoint(b.dataset.cp)});
  $('#warm').onclick=()=>{inCase=true;warmup()};
  const setRw=()=>{const spc=Math.max(1,Math.min(10,+$('#spc').value||3)),limit=Math.max(1,Math.min(99,+$('#lim').value||18));store.set('rwset',{spc,limit})};$('#spc').onchange=setRw;$('#lim').onchange=setRw;
  if($('#gave')){let armed=false;$('#gave').onclick=()=>{if(!armed){armed=true;$('#gave').textContent='Tap again to confirm';return}const r=rewards();r.given=Math.min(r.cards.length,r.given+1);saveRw(r);home()}}
  const twoStep=(btn,msg,act)=>{let armed=false;$(btn).onclick=()=>{if(!armed){armed=true;$(btn).textContent='Tap again to confirm';$(msg).textContent=''}else act()}};
  twoStep('#pu','#puc',()=>{if(!w2)unlock('w2');else unlock('w3');home()});
  twoStep('#pr','#prc',()=>{['hist','best','found','unlock','weak','towerMode','towerLevel','rw'].forEach(k=>store.set(k,null));try{['hist','best','found','unlock','weak','towerMode','towerLevel','rw'].forEach(k=>localStorage.removeItem('cd_'+k))}catch(e){}home()});
  scrollTo(0,0)}
function open(id){const c=CASES.find(x=>x.id===id);stopTimer();$('#homeBtn').hidden=false;c.go();scrollTo(0,0)}
function checkpoint(k){const cp=CHECKPOINTS[k];runQuiz({id:k,tag:'Mixed test',title:cp.title,secs:cp.secs,level:cp.level,pass:cp.pass,mixed:true,
  passMsg:`Passed! Week ${k==='cp1'?2:3} is now open.`,onPass:()=>{unlock(cp.unlocks);milestone(k,`Passed ${cp.title}`)},plan:cp.make(),remake:cp.make,
  rule:`<strong>Mixed questions, exam timing.</strong> Pass mark ${cp.pass} out of ${cp.of}. Eliminate first, then pick. Wrong answers come with case notes.`})}
function warmup(){const types=['count','impostor','opp',...(unlocked('w2')?['edge','drone']:[])],weak=store.get('weak',{});
  const make=()=>{const pool=[...types,...types.filter(t=>weak[t]),...types.filter(t=>weak[t])],out=shuffle(types.slice()).slice(0,Math.min(6,types.length));
    while(out.length<6)out.push(pick(pool));return shuffle(out)};
  runQuiz({id:'warm',tag:'Daily warm-up',title:'Warm-up',secs:45,level:1,mixed:true,plan:make(),remake:make,rule:'<strong>Six quick questions.</strong> A mix of everything unlocked so far.'})}
function mock(){const make=()=>shuffle([...repeat('count',5),...repeat('impostor',3),...repeat('opp',3),...repeat('edge',5),...repeat('drone',4)]);
  runQuiz({id:'mock',tag:'Week 3 · Exam practice',title:'The Final Mock',secs:40,level:2,mixed:true,plan:make(),remake:make,
    rule:'<strong>20 questions at exam pace: 40 seconds each.</strong> If you’re stuck, cross out what you can, make your best guess and move on.'})}

/* ============ Case 01: Tower Count ============ */
function tower(){
  let mode=store.get('towerMode','learn'),level=store.get('towerLevel',0);
  view.innerHTML=`<section class="sheet">
    <div class="sheet-head"><div><div class="tag">Case 01 · Counting cubes</div><h2>The Tower Count</h2></div>
      <div class="row"><div class="seg" id="mode"><button data-v="learn">Learn</button><button data-v="exam">Exam mode</button></div>
      <div class="seg" id="lvl"><button data-v="0">Easy</button><button data-v="1">Medium</button><button data-v="2">Hard</button></div></div></div>
    <div class="rule"><strong>The Tower Method.</strong> Don’t count cubes, count towers.
      <ol><li>Every floor square has one tower on it. Find each tower’s top.</li><li>Write how many cubes high it is. Cubes can’t float, so the hidden ones underneath count too.</li><li>Add up the tower numbers.</li></ol><p style="margin:6px 0 0"><b>Exam shortcut:</b> the cubes you can see are the smallest possible answer. Cross out any option below that first.</p></div>
    <div id="game"></div></section>`;
  const setSeg=(sel,v)=>view.querySelectorAll(sel+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==String(v)));
  setSeg('#mode',mode);setSeg('#lvl',level);
  view.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;store.set('towerMode',mode);setSeg('#mode',mode);start()});
  view.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{level=+b.dataset.v;store.set('towerLevel',level);setSeg('#lvl',level);start()});
  const start=()=>{stopTimer();mode==='learn'?towerLearn(level):towerExam(level)};
  start();
}
function planSVG(H,vals,sel,marks){
  const s=40,P=(x,y)=>[(x-y)*s,(x+y)*s/2];let pts=[];
  for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])pts.push(P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1));
  const mnX=Math.min(...pts.map(p=>p[0]))-4,mxX=Math.max(...pts.map(p=>p[0]))+4,mnY=Math.min(...pts.map(p=>p[1]))-4,mxY=Math.max(...pts.map(p=>p[1]))+4;
  let o=`<svg class="plan" viewBox="${mnX} ${mnY} ${mxX-mnX} ${mxY-mnY}" width="${mxX-mnX}" style="max-width:100%;margin:0 auto">`;
  for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++){if(!H[x][y])continue;const k=x+','+y;
    const poly=[P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)].map(p=>p.join(',')).join(' ');
    const m=marks[k],fill=m==='ok'?'var(--good-soft)':m==='no'?'var(--bad-soft)':k===sel?'var(--hl-top)':'var(--surface)';
    const[cx,cy]=P(x+.5,y+.5);
    o+=`<polygon class="cellp" data-k="${k}" points="${poly}" fill="${fill}" stroke="${k===sel?'var(--accent)':'var(--ink)'}" stroke-width="${k===sel?3:1.4}"/>`;
    o+=`<text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="${m==='no'?'var(--bad)':'var(--ink)'}" style="pointer-events:none">${vals[k]??''}</text>`}
  return o+'</svg>'}
function towerLearn(level){
  const H=genStack(level),keys=[];for(let x=0;x<H.length;x++)for(let y=0;y<H[0].length;y++)if(H[x][y])keys.push(x+','+y);
  const vals={},marks={};let sel=keys[0],xray=false,stage=1;
  const g=$('#game');
  g.innerHTML=`<div class="stage"><div class="panel"><canvas class="stack" id="cv"></canvas>
      <div class="row"><button id="xray" class="btn-ghost">Show tower numbers</button><button id="new" class="btn-ghost">New stack</button></div></div>
    <div class="panel"><h3>Step 1 · Height of each tower</h3><p class="muted" style="margin:0;font-size:.9rem">This is the floor seen from above, same way round. Tap a square, then its height. The matching tower lights up.</p>
      <div id="plan"></div><div class="keypad" id="kp">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
      <button id="chk1" class="btn-primary">Check towers</button>
      <div id="s2" hidden><h3>Step 2 · Add them up</h3><div class="row"><input id="tot" class="num" type="number" inputmode="numeric" min="0" aria-label="Total cubes"><button id="chk2" class="btn-primary">Check total</button></div></div>
      <div id="fb"></div></div></div><div id="notes"></div>`;
  const cv=$('#cv');
  const paint=()=>{drawStack(cv,H,{highlight:stage===1&&sel?sel.split(',').map(Number):null,labels:xray});
    $('#plan').innerHTML=planSVG(H,vals,stage===1?sel:null,marks);
    $('#plan').querySelectorAll('.cellp').forEach(p=>p.onclick=()=>{sel=p.dataset.k;paint()})};
  redraw=paint;paint();
  const setVal=n=>{if(!sel||stage!==1)return;vals[sel]=n;delete marks[sel];const i=keys.indexOf(sel);const nxt=keys.slice(i+1).concat(keys.slice(0,i)).find(k=>vals[k]==null);if(nxt)sel=nxt;paint()};
  $('#kp').querySelectorAll('button').forEach(b=>b.onclick=()=>setVal(+b.dataset.n));
  g.onkeydown=e=>{if(stage===1&&/^[1-6]$/.test(e.key)&&e.target.tagName!=='INPUT')setVal(+e.key)};
  document.onkeydown=g.onkeydown;
  $('#xray').onclick=()=>{xray=!xray;$('#xray').textContent=xray?'Hide tower numbers':'Show tower numbers';paint()};
  $('#new').onclick=()=>towerLearn(level);
  $('#chk1').onclick=()=>{
    const missing=keys.filter(k=>vals[k]==null);
    if(missing.length){$('#fb').innerHTML=`<div class="feedback no">${missing.length} tower${missing.length>1?'s':''} still blank. Every floor square needs a number.</div>`;sel=missing[0];paint();return}
    let wrong=0;keys.forEach(k=>{const[x,y]=k.split(',').map(Number);marks[k]=vals[k]===H[x][y]?'ok':'no';if(marks[k]==='no')wrong++});
    if(wrong){sel=keys.find(k=>marks[k]==='no');paint();
      const wk=keys.filter(k=>marks[k]==='no'),N=towerNotes(H,{wrong:wk});
      $('#fb').innerHTML=`<div class="feedback no">${wrong} tower${wrong>1?'s are':' is'} off (in red). Read the case notes below, fix the red numbers, then check again.</div>`;
      $('#notes').innerHTML=N.html;N.draw();redraw=()=>{paint();N.draw()}}
    else{$('#notes').innerHTML='';redraw=paint;stage=2;paint();$('#chk1').hidden=true;$('#kp').hidden=true;$('#s2').hidden=false;$('#fb').innerHTML=`<div class="feedback ok">All towers right. Now add them.</div>`;$('#tot').focus()}};
  $('#chk2').onclick=()=>{const t=total(H),v=+$('#tot').value;
    const sum=keys.map(k=>{const[x,y]=k.split(',').map(Number);return H[x][y]}).join(' + ');
    if(v===t){xray=true;paint();addPoints(15);$('#fb').innerHTML=`<div class="feedback ok"><b>Case closed: ${t} cubes.</b><br>${sum} = ${t}</div><div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">Next stack →</button></div>`;$('#nx').onclick=()=>towerLearn(level)}
    else $('#fb').innerHTML=`<div class="feedback no">Not quite. Add the numbers on the floor plan again, one row at a time.</div>`};
}
function towerExam(level){
  const ROUNDS=8,SECS=45;let n=0,score=0;const g=$('#game');
  const next=()=>{
    if(n===ROUNDS){stopTimer();redraw=null;record('tower',score,ROUNDS,level);
      g.innerHTML=`<div class="done"><div class="big">${score} / ${ROUNDS}</div><p>${score>=7?'Sharp detective work.':score>=5?'Good. Use the Tower Method on every stack, even easy-looking ones.':'Switch to Learn for a few stacks, then try again.'}</p><button class="btn-primary" id="again">Play again</button></div>`;$('#again').onclick=()=>towerExam(level);return}
    n++;const H=genStack(level),t=total(H);
    const opts=shuffle([...new Set([t,t-1,t+1,t-2,t+2])].filter(v=>v>0)).slice(0,5);
    let answered=false,labels=false,left=SECS;
    g.innerHTML=`<div class="row" style="justify-content:space-between"><span class="score">Question ${n} of ${ROUNDS}</span><span class="score">Score ${score}</span></div>
      <div class="timer"><i id="bar"></i></div>
      <p style="margin:0;font-weight:600">How many cubes are in this stack?</p>
      <canvas class="stack" id="cv"></canvas><div class="options">${opts.map(o=>`<button data-v="${o}">${o}</button>`).join('')}</div><div id="fb"></div>`;
    const cv=$('#cv');redraw=()=>drawStack(cv,H,{labels});redraw();
    const finish=v=>{if(answered)return;answered=true;stopTimer();labels=true;redraw();
      g.querySelectorAll('.options button').forEach(b=>{b.disabled=true;if(+b.dataset.v===t)b.classList.add('right');else if(+b.dataset.v===v)b.classList.add('wrong')});
      if(v===t)score++;
      const nav=`<div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">${n===ROUNDS?'See score':'Next →'}</button></div>`;
      if(v===t){$('#fb').innerHTML=`<div class="feedback ok"><b>Correct: ${t}.</b> The numbers show each tower’s height.</div>`+nav}
      else{const N=towerNotes(H,{given:v,timeout:v==null});
        $('#fb').innerHTML=`<div class="feedback no"><b>${v==null?'Time’s up.':'Not quite.'}</b> It’s ${t}. Here’s what happened.</div>`+N.html+nav;
        N.draw();redraw=()=>{drawStack(cv,H,{labels});N.draw()}}
      $('#nx').onclick=next};
    g.querySelectorAll('.options button').forEach(b=>b.onclick=()=>finish(+b.dataset.v));
    timerId=setInterval(()=>{left-=.25;$('#bar').style.width=Math.max(0,left/SECS*100)+'%';if(left<=0)finish(null)},250);
  };
  next();
}

/* ============ Case 02: Impostor ============ */
function impostor(){
  const ROUNDS=10;let n=0,score=0;
  view.innerHTML=`<section class="sheet"><div class="sheet-head"><div><div class="tag">Case 02 · Nets of cubes</div><h2>Spot the Impostor</h2></div><span class="score" id="sc"></span></div>
    <div class="rule"><strong>Check the shape before the symbols.</strong><ul><li><b>Four in a line?</b> One wing on each side. Both wings on the same side = fake.</li><li><b>No 2×2 block</b> of squares.</li><li><b>No line of 5</b> or more.</li></ul></div><div id="game"></div></section>`;
  const g=$('#game');
  const next=()=>{
    if(n===ROUNDS){saveBest('impostor',{n:score,of:ROUNDS});g.innerHTML=`<div class="done"><div class="big">${score} / ${ROUNDS}</div><p>${score>=9?'No impostor gets past you.':'Read the rule box again, then go for 10 out of 10.'}</p><button class="btn-primary" id="again">Play again</button></div>`;$('#again').onclick=impostor;return}
    n++;$('#sc').textContent=`Shape ${n} of ${ROUNDS} · Score ${score}`;
    const real=Math.random()<.5;const base=real?pick(NETS):(Math.random()<.6?pick(TRAPS):pick(FAKES));const cells=randomPose(base);
    g.innerHTML=`<div class="netbox" id="nb">${netSVG(cells)}</div><div class="stamps"><button class="stamp real" data-v="1">REAL</button><button class="stamp fake" data-v="0">FAKE</button></div><div id="fb"></div>`;
    g.querySelectorAll('.stamp').forEach(b=>b.onclick=()=>{
      const said=b.dataset.v==='1',right=said===real;if(right)score++;$('#sc').textContent=`Shape ${n} of ${ROUNDS} · Score ${score}`;
      g.querySelectorAll('.stamp').forEach(x=>x.disabled=true);
      let fill={},stroke={},why;
      if(real){const f=fold(cells).face;const col=['var(--p1)','var(--p1)','var(--p2)','var(--p2)','var(--p3)','var(--p3)'];cells.forEach(([r,c],i)=>fill[r+','+c]=col[f[i]]);
        why=`It folds into a cube. Same colours = opposite faces. This one is a <b>${family(cells)}</b> net.`}
      else{const d=diagnose(cells);d.hot.forEach(([r,c])=>{fill[r+','+c]='var(--bad-soft)';stroke[r+','+c]='var(--bad)'});why=d.why}
      $('#nb').innerHTML=netSVG(cells,{fill,stroke})+`<div class="verdict ${real?'real':'fake'}">${real?'REAL':'FAKE'}</div>`;
      $('#fb').innerHTML=`<div class="feedback ${right?'ok':'no'}"><b>${right?'Correct.':'Caught you out.'}</b> ${why}</div>${right?'':netNotes(cells,{real})}<div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">${n===ROUNDS?'See score':'Next shape →'}</button></div>`;$('#nx').onclick=next});
  };
  next();
}

/* ============ Case 03: The Missing Eleven ============ */
function hunt(){
  let found=store.get('found',[]).filter(k=>NET_KEYS.includes(k));const on=new Set();
  view.innerHTML=`<section class="sheet"><div class="sheet-head"><div><div class="tag">Case 03 · Nets of cubes</div><h2>The Missing Eleven</h2></div><span class="score" id="cnt"></span></div>
    <div class="rule">Tap 6 squares to draw a net, then check it. A net that’s the same as one you’ve found, just turned or flipped, doesn’t count twice. <strong>Families:</strong> 6 × 1-4-1, 3 × 1-3-2, 1 × 2-2-2 staircase, 1 × 3-3.</div>
    <div class="stage"><div class="panel"><div class="hunt" id="grid">${[...Array(25)].map((_,i)=>`<button class="cell" id="c${i}" data-i="${i}" aria-pressed="false" aria-label="Square ${i+1}"></button>`).join('')}</div>
      <div class="row"><button class="btn-primary" id="chk" disabled>Check net</button><button class="btn-ghost" id="clr">Clear</button><span class="muted" id="n6">0 / 6 squares</span></div><div id="fb"></div></div>
      <div class="panel"><h3>Case board</h3><div class="gallery" id="gal"></div><div class="row"><button class="btn-ghost" id="rehunt">Start the hunt again</button><span class="muted" id="rehuntm"></span></div></div></div><div id="notes"></div></section>`;
  const paintGal=(flash)=>{$('#cnt').textContent=`${found.length} of 11 found`;
    $('#gal').innerHTML=NETS.map((c,i)=>{const k=NET_KEYS[i],has=found.includes(k);return`<div class="slot ${has?'found':''} ${k===flash?'flash':''}">${has?netSVG(c,{size:14}):'<span class="q">?</span>'}<small>${family(c)}</small></div>`}).join('')};
  paintGal();
  let armed=false;$('#rehunt').onclick=()=>{if(!armed){armed=true;$('#rehunt').textContent='Tap again to clear the board';$('#rehuntm').textContent='Her other progress is kept.';return}
    found=[];store.set('found',found);armed=false;$('#rehunt').textContent='Start the hunt again';$('#rehuntm').textContent='Board cleared. Find all 11 again!';paintGal()};
  const upd=()=>{$('#n6').textContent=`${on.size} / 6 squares`;$('#chk').disabled=on.size!==6};
  $('#grid').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(on.has(i))on.delete(i);else{if(on.size>=6)return;on.add(i)}b.setAttribute('aria-pressed',on.has(i));upd()});
  $('#clr').onclick=()=>{on.clear();$('#grid').querySelectorAll('.cell').forEach(b=>b.setAttribute('aria-pressed','false'));upd();$('#fb').innerHTML='';$('#notes').innerHTML=''};
  $('#chk').onclick=()=>{
    const cells=[...on].map(i=>[Math.floor(i/5),i%5]);const has=new Set(cells.map(p=>p.join(',')));
    const seen=new Set([cells[0].join(',')]),q=[cells[0]];while(q.length){const[r,c]=q.pop();for(const[dr,dc]of DIRS){const k=(r+dr)+','+(c+dc);if(has.has(k)&&!seen.has(k)){seen.add(k);q.push([r+dr,c+dc])}}}
    if(seen.size<6){$('#fb').innerHTML=`<div class="feedback no">The squares must all join edge to edge, in one piece.</div>`;return}
    const k=canon(cells);
    if(!NET_KEYS.includes(k)){$('#fb').innerHTML=`<div class="feedback no"><b>Impostor!</b> That shape can’t fold into a cube. See the case notes below.</div>`;$('#notes').innerHTML=netNotes(norm(cells),{real:false});return}
    if(found.includes(k)){$('#fb').innerHTML=`<div class="feedback no">Real net, but you already have it on the case board. Turn it or flip it in your head and you’ll see it’s the same one.</div>`;paintGal(k);return}
    found.push(k);store.set('found',found);paintGal(k);addPoints(20);if(found.length===11&&onceFlag('all11'))stamp('Found all 11 nets');
    $('#clr').click();$('#fb').innerHTML=found.length===11?`<div class="feedback ok"><b>All 11 found. Case closed!</b></div>`:`<div class="feedback ok"><b>New net found!</b> It’s a ${family(norm(cells))}. ${11-found.length} to go.</div>`};
  upd();
}

/* ============ Case 04: Opposites ============ */
function opposites(){
  const ROUNDS=8;let n=0,score=0;
  view.innerHTML=`<section class="sheet"><div class="sheet-head"><div><div class="tag">Case 04 · Nets of cubes</div><h2>Opposite Suspects</h2></div><span class="score" id="sc"></span></div>
    <div class="rule"><strong>Tap the square that ends up opposite the ★.</strong><ul><li>In a straight line of three, the 1st and 3rd are opposite.</li><li>In a zigzag, the two ends are opposite.</li><li>Opposite faces can never be seen together on a cube.</li></ul></div><div id="game"></div></section>`;
  const g=$('#game');
  const next=()=>{
    if(n===ROUNDS){saveBest('opp',{n:score,of:ROUNDS});g.innerHTML=`<div class="done"><div class="big">${score} / ${ROUNDS}</div><p>${score>=7?'Opposites spotted every time.':'Look for straight lines of three first. They give the answer fastest.'}</p><button class="btn-primary" id="again">Play again</button></div>`;$('#again').onclick=opposites;return}
    n++;$('#sc').textContent=`Round ${n} of ${ROUNDS} · Score ${score}`;
    const cells=randomPose(pick(NETS)),f=fold(cells).face,s=rnd(6),ans=f.findIndex(x=>x===(f[s]^1));
    const star={[cells[s].join(',')]:'★'};
    g.innerHTML=`<div class="netbox" id="nb">${netSVG(cells,{marks:star,click:true,size:54})}</div><div id="fb"></div>`;
    $('#nb').querySelectorAll('rect[data-i]').forEach(r=>r.onclick=()=>{
      const i=+r.dataset.i;if(i===s)return;const ok=i===ans;if(ok)score++;$('#sc').textContent=`Round ${n} of ${ROUNDS} · Score ${score}`;
      const col=['var(--p1)','var(--p1)','var(--p2)','var(--p2)','var(--p3)','var(--p3)'],fill={},stroke={};cells.forEach(([r2,c2],j)=>fill[r2+','+c2]=col[f[j]]);
      if(!ok)stroke[cells[i].join(',')]='var(--bad)';
      $('#nb').innerHTML=netSVG(cells,{marks:star,fill,stroke,size:54});
      $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not that one.'}</b> Same colours are opposite pairs. Every net has exactly three pairs.</div>${ok?'':oppNotes(cells,f,s,ans,i)}<div class="row" style="margin-top:10px"><button class="btn-primary" id="nx">${n===ROUNDS?'See score':'Next →'}</button></div>`;$('#nx').onclick=next});
  };
  next();
}
home();
